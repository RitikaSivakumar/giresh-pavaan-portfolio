  </text>
  <line x1="690" y1="525" x2="830" y2="525" stroke="#8C6D4F" stroke-width="1"/>
  <text x="760" y="542" fill="#A8988B" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" letter-spacing="1.5">
    ACADEMIC SYMPOSIA
  </text>

  <!-- Watermark code -->
  <text x="860" y="582" fill="#D4AF37" fill-opacity="0.3" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="end" letter-spacing="1">
    DOC ID: GP-CERT-2025/2026-MCET
