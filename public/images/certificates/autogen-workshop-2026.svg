  </text>

  <!-- Organizing Institution -->
  <text x="450" y="385" fill="#E8DFD8" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1.2">
    ORGANIZED BY: PSG INSTITUTE OF TECHNOLOGY AND APPLIED RESEARCH (PSG ITECH)
  </text>

  <!-- Official Badge Pill -->
  <rect x="350" y="415" width="200" height="26" rx="13" fill="#14110E" stroke="#8C6D4F" stroke-width="1.5"/>
  <circle cx="365" cy="428" r="4" fill="#8C6D4F"/>
  <text x="454" y="432" fill="#8C6D4F" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.8">
    PSG iTech VERIFIED
  </text>

  <!-- Bottom Divider -->
  <line x1="80" y1="470" x2="820" y2="470" stroke="#D4AF37" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Left Signatory / Date -->
  <text x="140" y="515" fill="#E8DFD8" font-family="'Cinzel', serif" font-size="12" font-weight="600" text-anchor="middle">
    21 February 2026
  </text>
  <line x1="70" y1="525" x2="210" y2="525" stroke="#8C6D4F" stroke-width="1"/>
  <text x="140" y="542" fill="#A8988B" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" letter-spacing="1.5">
    OFFICIAL DATE
  </text>

  <!-- Center Metallic Seal -->
  <circle cx="450" cy="520" r="32" fill="#14110E" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="450" cy="520" r="26" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="3 2"/>
  <circle cx="450" cy="520" r="20" fill="url(#sealGrad)" opacity="0.25"/>
  <!-- Star icon inside seal -->
  <polygon points="450,506 454,516 464,517 456,523 459,533 450,527 441,533 444,523 436,517 446,516" fill="#D4AF37"/>
  <text x="450" y="570" fill="#D4AF37" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="1.5">
